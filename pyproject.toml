[project]
name = "elastic-net-tool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "glum>=2.0",
    "scikit-learn>=1.0",
    "polars>=0.19",
    "numpy>=1.22",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "panel>=1.0",
    "pandas>=1.5",
    "pyarrow>=10.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
full = ["lightgbm", "shap", "openpyxl", "optbinning"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["elastic_net_tool/gui.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C90", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50
